services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: footi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-footi}
      POSTGRES_DB: footi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footi"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://footi:${POSTGRES_PASSWORD:-footi}@db:5432/footi
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-footi-admin}
      PLAYER_MV_FLOOR: ${PLAYER_MV_FLOOR:-40000000}
      PLAYER_GK_MV_FLOOR: ${PLAYER_GK_MV_FLOOR:-15000000}
      TOP_CLUB_MV_FLOOR: ${TOP_CLUB_MV_FLOOR:-18000000}
      PLAYER_FC_RATING_FLOOR: ${PLAYER_FC_RATING_FLOOR:-83}
      GUESS_GK_MV_FLOOR: ${GUESS_GK_MV_FLOOR:-30000000}
      GUESS_DEF_MV_FLOOR: ${GUESS_DEF_MV_FLOOR:-60000000}
      GUESS_MID_MV_FLOOR: ${GUESS_MID_MV_FLOOR:-70000000}
      GUESS_ATT_MV_FLOOR: ${GUESS_ATT_MV_FLOOR:-80000000}
      GUESS_FC_RATING_FLOOR: ${GUESS_FC_RATING_FLOOR:-85}
      PORT: "3000"
    volumes:
      - ./seed:/seed:ro
      - ./db:/app/db:ro
      - ./Database:/app/database:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-1234}:80"
    depends_on:
      - server

volumes:
  pgdata: